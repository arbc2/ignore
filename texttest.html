<!DOCTYPE html>
<html>
<head>
<title>cable two</title>

<style>
body {
  background-color: #0d0d16;
  color: #b6a6ff;
  font-family: "Courier New", monospace;
  text-align: center;
  margin: 0;
  padding: 40px;
}

.container {
  max-width: 600px;
  margin: auto;
}

/* ===== YOUR TICKER STYLES (slightly adapted so it doesn't take over page) ===== */

.ticker-bar {
  width: 100%;
  height: 40px;
  margin: 30px 0;
  display: flex;
}

.left-box {
  width: 80px;
  background: #333;
  display: flex;
  align-items: center;
  justify-content: center;
}

.left-box img {
  height: 50px;
}

#ticker-container {
  flex-grow: 1;
  overflow: hidden;
  background: rgba(0,0,0,0.4);
  display: flex;
  align-items: center;
}

#scroller {
  display: inline-block;
  white-space: nowrap;
  animation: ticker 60s linear infinite;
}

.ticker-item {
  color: white;
  font-size: 12px;
  margin: 0 10px;
}

.right-box {
  background: white;
  color: black;
  display: flex;
  align-items: center;
  padding: 0 10px;
  font-size: 11px;
  font-weight: bold;
}

@keyframes ticker {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* ===== normal page ===== */

a {
  color: #8fffd1;
  text-decoration: none;
}

.divider {
  margin: 30px 0;
  color: #444;
}
</style>
</head>

<body>
<div class="container">

<h1>it's cable two</h1>

<!-- ✦ YOUR TICKER INSERTED HERE ✦ -->
<div class="ticker-bar">

  <div class="left-box">
    <img src="https://cabletwo.net/home/sphere.gif">
  </div>

  <div id="ticker-container">
    <div id="scroller"></div>
  </div>

  <div class="right-box" id="username">ARBY</div>

</div>

<p>
a television network<br>
exploring the possibilities<br>
of live video as a medium
</p>

<div class="divider">✦ ✦ ✦</div>

<p>
Cable Two isn't a name.<br>
It's a threat and a promise.
</p>

</div>

<script>
const items = [
  'VISIT CABLETWO.NET',
  'WED 5PM',
  'WARP ZONE',
  'LATER',
  'FANTASY FLIGHT',
  'MUCH LATER',
  'STAY TUNED FOR MORE ON C2'
];

const scroller = document.getElementById('scroller');

const duplicated = [...items, ...items];

duplicated.forEach((item, i) => {
  const span = document.createElement('span');
  span.className = 'ticker-item';
  span.textContent = item;
  scroller.appendChild(span);

  if (i < duplicated.length - 1) {
    const dot = document.createElement('span');
    dot.className = 'ticker-item';
    dot.style.opacity = '0.5';
    dot.textContent = '•';
    scroller.appendChild(dot);
  }
});
</script>

</body>
</html>
